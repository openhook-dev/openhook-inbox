services:
  openhook:
    build:
      context: .
      target: core
    restart: unless-stopped
    environment:
      OPENHOOK_ORIGIN: ${OPENHOOK_ORIGIN:-https://openhook.dev}
      OPENHOOK_DATABASE: /data/openhook.sqlite3
      OPENHOOK_UMAMI_SCRIPT_URL: ${OPENHOOK_UMAMI_SCRIPT_URL:-}
      OPENHOOK_UMAMI_WEBSITE_ID: ${OPENHOOK_UMAMI_WEBSITE_ID:-}
      OPENHOOK_METRICS_TOKEN: ${OPENHOOK_METRICS_TOKEN:-}
      OPENHOOK_STORAGE_LIMIT: ${OPENHOOK_STORAGE_LIMIT:-1073741824}
      OPENHOOK_CHANNEL_LIMIT: ${OPENHOOK_CHANNEL_LIMIT:-1000}
      OPENHOOK_SUPPORT_EMAIL: ${OPENHOOK_SUPPORT_EMAIL:-hello@openhook.dev}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-10.0.1.0/24}
    volumes:
      - openhook-data:/data
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
volumes:
  openhook-data:
