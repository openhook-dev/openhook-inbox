services:
  openhook:
    build: .
    restart: unless-stopped
    environment:
      OPENHOOK_ORIGIN: ${OPENHOOK_ORIGIN:-https://openhook.dev}
      OPENHOOK_DATABASE: /data/openhook.sqlite3
      OPENHOOK_EMAIL_DOMAIN: ${OPENHOOK_EMAIL_DOMAIN:-}
      OPENHOOK_DNS_DOMAIN: ${OPENHOOK_DNS_DOMAIN:-}
      OPENHOOK_DNS_ADDRESS: ${OPENHOOK_DNS_ADDRESS:-127.0.0.1}
      OPENHOOK_STORAGE_LIMIT: ${OPENHOOK_STORAGE_LIMIT:-1073741824}
      OPENHOOK_HOSTED: ${OPENHOOK_HOSTED:-false}
      OPENHOOK_GITHUB_CLIENT_ID: ${OPENHOOK_GITHUB_CLIENT_ID:-}
      OPENHOOK_GITHUB_CLIENT_SECRET: ${OPENHOOK_GITHUB_CLIENT_SECRET:-}
      OPENHOOK_BILLING_ENABLED: ${OPENHOOK_BILLING_ENABLED:-false}
      OPENHOOK_STRIPE_SECRET_KEY: ${OPENHOOK_STRIPE_SECRET_KEY:-}
      OPENHOOK_STRIPE_WEBHOOK_SECRET: ${OPENHOOK_STRIPE_WEBHOOK_SECRET:-}
      OPENHOOK_STRIPE_PRICE_ID: ${OPENHOOK_STRIPE_PRICE_ID:-}
      OPENHOOK_STRIPE_LIVE: ${OPENHOOK_STRIPE_LIVE:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-10.0.1.0/24}
    ports:
      - "${OPENHOOK_BIND_ADDRESS:-127.0.0.1}:25:2525"
      - "${OPENHOOK_BIND_ADDRESS:-127.0.0.1}:53:5353/tcp"
      - "${OPENHOOK_BIND_ADDRESS:-127.0.0.1}:53:5353/udp"
    volumes:
      - openhook-data:/data
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
volumes:
  openhook-data:
