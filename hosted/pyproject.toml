[project]
name = "openhook-hosted"
version = "0.1.0"
description = "Optional Openhook hosted login and billing service"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["openhook-mcp==0.1.0", "standardwebhooks>=1.0.0,<2"]

[project.scripts]
openhook-hosted = "openhook_hosted.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openhook_hosted"]
