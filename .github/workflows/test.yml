name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun run build
      - run: git diff --exit-code -- web
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-packages --extra dev
      - run: uv run --no-sync pytest -q
      - run: uv run python scripts/generate_docs.py --check
      - run: node --check web/assets/app.js
      - run: node --check web/assets/home.js
      - run: node --check web/assets/account.js
      - run: node --test native_tests/analytics.test.mjs
      - run: uv build --all-packages
      - run: uv venv /tmp/openhook-core-check
      - run: uv pip install --python /tmp/openhook-core-check/bin/python dist/openhook_mcp-*.whl
      - run: /tmp/openhook-core-check/bin/python -I scripts/check_core_distribution.py dist/openhook_mcp-*.whl
