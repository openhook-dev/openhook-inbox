<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="is-agentic-site-type" content="app">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:site_name" content="Openhook">
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{origin}}/assets/organization-logo.png">
  <meta property="og:image:alt" content="Openhook — A channel for your agents">
  <meta property="og:image:width" content="460">
  <meta property="og:image:height" content="460">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=604e6a773711">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{origin}}/assets/organization-logo.png">
  <meta name="twitter:image:alt" content="Openhook — A channel for your agents">
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" type="{{alternate_type}}" href="{{alternate}}" title="Openhook text documentation">
  <link rel="service-desc" type="application/vnd.oai.openapi+json" href="/openapi.json">
  {{structured_data}}
  {{analytics}}
  {{frontend_assets}}
  <link rel="preload" href="/assets/fonts/paper-mono.woff2?v=57b28aaaffc4" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/style.css?v=747d4015a3eb">
  <script src="/assets/app.js?v=2e2aab92d76b" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Openhook home"><img class="brand-logo" src="/assets/organization-logo.png" width="28" height="28" alt="" decoding="async">openhook</a>
    <nav aria-label="Main navigation"><a href="/channels">Channels</a><a href="/connect">Connect your agent</a><a href="/docs">Docs</a></nav>
  </header>
  <main id="main" tabindex="-1">{{breadcrumbs}}{{content}}</main>
  <footer><a href="/guides">Guides</a><a href="/use-cases">Use cases</a><a href="https://github.com/openhook-dev/openhook-inbox">Source</a><a href="/about">About</a><a href="/contact">Contact</a><a href="/privacy">Privacy</a>{{support_link}}<a href="/skill.md">Agent skill</a></footer>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
