[project]
name = "openhook-mcp"
version = "0.1.0"
description = "Self-hosted webhook, email, and DNS inboxes for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Openhook"}]
keywords = ["mcp", "webhook", "testing", "model-context-protocol", "bugbounty", "api-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.26.0",
    "aiosmtpd>=1.4.6",
    "dnslib>=0.9.26",
    "uvicorn>=0.35.0",
    "starlette>=0.47.0",
]

[project.scripts]
openhook = "server:run_server"
openhook-mcp = "server:run_server"
openhook-listen = "openhook.listener:main"

[project.urls]
Homepage = "https://openhook.dev"
Repository = "https://github.com/openhook-dev/openhook-inbox"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openhook"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"web_app.py" = "web_app.py"
"web" = "web"
"py.typed" = "py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["native_tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
